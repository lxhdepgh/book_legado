# ============================================================
#  codeConfig.yaml
#  由 codeConfigtemplate.yaml (v4.0) 初始化生成于 2026-09-01。
#  事实源：本文件；模板文件保持原样不动。
#  严禁在本文件中写入任何真实密钥、令牌、密码或已填充的 .env 值。
# ============================================================


# ---------- 元信息 ----------
version: 4.0
schema: codeConfigtemplate.yaml   # 指向模板，便于回溯格式版本


# ============================================================
# 1. 项目基本信息
# ============================================================
project:
  name: "legodo_booksource_check"
  root: "d:\\WorkSpace\\PycharmProjects\\legodo_booksource_check"
  platform: "windows"
  shell: "powershell"
  timezone: "Asia/Shanghai"
  description: "Legado 书源连通性/搜索可用性检测与内置阅读器；主线为 Flutter + Go 单进程 FFI（legodo_dart），Flet 版保留作功能参照"
  primary_language: "dart"           # 引擎为 Go（legodo_dart/backend_go）；Python 仅剩 legodo_flet 参照实现


# ============================================================
# 2. 知识库索引（核心）
#    智能体在后续会话中按这些 location 加载上下文文件。
# ============================================================
knowledge_base:

  # ---- 2.1 开发文档：架构、接口、部署等"是什么/怎么用" ----
  docs:
    index:
      path: "docs/文档总览.md"
      required: true                 # 入口：读哪篇、哪篇作废、同题两的说冲突时信谁
    design_doc:
      path: "docs/current-system-design.md"
      required: true                 # 系统设计文档，智能体必读
      note: "2026-10-20 重写为现架构（Flutter + Go 单进程 FFI）；旧 Flet 进程内版已移入 docs/archive/"
    operations_manual:
      path: "legodo_dart/README_BUILD.md"
      required: false                # 构建与打包权威；根 BUILD.md 只是路标
    testing_guide:
      path: "docs/local-testing-guide.md"
      required: false                # 本地测试指南（四道守口 + Windows 仪器坑）
    gap_ledger:
      path: "docs/dart补缺方案.md"
      required: false                # 缺口与待拍板台账（唯一仍在生长的高层文档）

  # ---- 2.2 开发约束：编码规范、架构红线、提交规范等"不许做什么" ----
  constraints:
    coding_style:
      path: "docs/coding-style.md"
      required: true                 # 代码风格
    architecture_rules:
      path: "docs/architecture-rules.md"
      required: true                 # 架构红线（2026-10-20 重写；旧 G1 版在 docs/archive/，其编号已作废）
    git_workflow:
      path: "docs/git-workflow.md"
      required: false                # 分支/提交规范
    secrets_policy:
      path: "docs/secrets-policy.md"
      required: true                 # 密钥管理策略（禁止入库等）
      note: "严禁将令牌、密码、私钥、已填充的 .env 值写入仓库或本配置"

  # ---- 2.3 开发日志：每次会话开始前的"续接点" ----
  dev_logs:
    root: "docs/dev-logs/"           # 日志目录（按日期命名，如 2026-09-01.md）
    current: "docs/dev-logs/2026-10-20.md"  # 指向【最新】日志文件
    required: true
    note: >
      智能体每次会话开始前必须读取 current 指向的日志，
      了解上次进展、遗留问题与下一步计划；会话结束前更新该文件。

  # ---- 2.4 问题记录：历史踩坑、已知缺陷、解决方案 ----
  known_issues:
    root: "docs/known-issues/"       # 问题记录目录
    index: "docs/known-issues/README.md"  # 问题索引
    required: false
    note: >
      遇到报错或异常行为时，智能体应先检索此目录是否已有同类记录，
      避免重复踩坑；解决后补充条目。


# ============================================================
# 3. 运行时环境（按需启用，不涉及整块置 enabled: false，勿删除）
# ============================================================

python:
  enabled: true                      # 只对 legodo_flet 参照实现与根 tests/ 生效；主线不是 Python
  environment_manager: "conda"       # conda 安装于 D:\env_manger\minicaoda
  environment_name: "legodo_booksource_check"
  interpreter: "D:\\env_manger\\minicaoda\\envs\\legodo_booksource_check\\python.exe"
  activate: "conda activate legodo_booksource_check"
  version_requirement: ">=3.12"      # 当前环境 3.12.13
  commands:
    test: "python -m pytest -q --basetemp=.tmp_pt/pytest"   # 默认 basetemp 有 ACL 拒绝，会整批假红
    lint: ""                         # 暂不配置（ruff 未安装）
    syntax_check: "python -m compileall -q legodo_flet/app" # 旧值 `app main.py` 指向已删除的根 app/

frontend:
  enabled: true                      # 主线前端 = Flutter（legodo_dart）
  directory: "legodo_dart"
  package_manager: "pub"
  commands:
    install: "flutter pub get"
    typecheck: "dart analyze"
    build: "python build_release.py windows"

backend_go:
  enabled: true                      # 引擎：Go c-shared，经 dart:ffi 同进程直调（无端口、无子进程）
  directory: "legodo_dart/backend_go"
  commands:
    test: "go test ./... -count=1"   # 需 C:\\mingw64\\bin 前置 PATH，否则 exit 2 不吐错误
    lint: "go vet ./..."
    build: "go build -buildmode=c-shared -o legodo_engine.dll ./pkg/ffi/"

docker:
  enabled: false                     # 本项目不容器化
  compose_file: "compose.yml"
  validate: "docker compose config --quiet"

database:
  enabled: true                      # SQLite 主库，落在用户数据目录而非仓库
  type: "sqlite"
  path: "%LOCALAPPDATA%\\LegadoBookSourceCheck\\legado.db"   # 覆盖用 LEGADO_BOOKSOURCE_DATA_DIR
  migrations_dir: ""                 # 建表与 *_v2 重建都在 backend_go/core/storage.go，无独立迁移目录
  migrate_command: ""


# ============================================================
# 4. 工作流（智能体如何开始 / 结束一次会话）
# ============================================================
workflow:

  # 会话开始时（续接上下文）
  on_session_start:
    - 读取 codeConfig.yaml，理解项目结构与约束
    - 读取 knowledge_base.docs.index（docs/文档总览.md），查清"该读哪篇、哪篇已作废"
    - 读取 knowledge_base.dev_logs.current，续接上次进度
    - 读取 knowledge_base.constraints.*，明确红线
    - 读取 knowledge_base.docs.design_doc，理解架构
    - 检查 git status，保留开发者未提交的改动

  # 改动完成后（验证；按改的是哪一侧选门，命令的坑见 docs/local-testing-guide.md）
  on_change_verify:
    - 改到 Go 引擎：按 backend_go.commands 跑 lint + test（需 MinGW 前置 PATH）
    - 改到界面或协议面：按 frontend.commands 跑 typecheck + test（flutter test）
    - 动过 action 清单：go test ./pkg/ffi -run Route 整表重提取，不许手工补条
    - 改到 legodo_flet 参照实现：按 python.commands.test 跑根 tests/（必带 --basetemp）
    - 按 backend_go.commands.build / frontend.commands.build 重编产物并同步 dist/（cmp 核逐字节）
    - 按 docker.validate 校验 compose（enabled 时；本项目当前不容器化）

  # 会话结束前（沉淀上下文）
  on_session_end:
    - 更新 knowledge_base.dev_logs.current（本次改动、遗留问题、下一步）
    - 遇新问题时，在 knowledge_base.known_issues 追加记录
    - 若约束/文档有变更，同步更新对应文件
